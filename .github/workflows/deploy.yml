name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Install docker compose v2 plugin if not present
            if ! docker compose version &>/dev/null 2>&1; then
              mkdir -p ~/.docker/cli-plugins
              curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 \
                -o ~/.docker/cli-plugins/docker-compose
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi

            cd ${{ secrets.DEPLOY_PATH }}

            echo "--- Pulling latest code ---"
            git checkout -- .
            git pull origin main

            echo "--- Cleaning unused Docker resources to free disk space ---"
            docker system prune -f
            docker volume prune -f

            echo "--- Installing backend dependencies ---"
            venv/bin/pip install -q -r requirements.txt

            echo "--- Running database migrations ---"
            venv/bin/alembic upgrade head

            # The API runs from the venv as the systemd unit criollitos-backend,
            # which owns port 8000; only Celery lives in Docker.
            echo "--- Restarting backend ---"
            sudo systemctl restart criollitos-backend

            echo "--- Rebuilding and recreating Celery ---"
            docker compose build celery_worker celery_beat
            docker compose up -d --no-deps celery_worker celery_beat

            echo "--- Health check ---"
            for i in $(seq 1 20); do
              curl -sf http://localhost:8000/api/health > /dev/null && break
              sleep 2
            done
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Health check passed"
            else
              echo "Health check failed"
              sudo journalctl -u criollitos-backend -n 50 --no-pager
              exit 1
            fi

            echo "--- Deploy complete. Commit: $(git rev-parse --short HEAD) ---"
